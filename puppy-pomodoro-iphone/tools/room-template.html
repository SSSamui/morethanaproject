<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Pork's room for the iPhone app. Built by tools/build_room.py from
     tools/room-template.html and tools/pork.js. Don't edit App/room.html directly. -->
<style>
:root {
  --text: #2d2620; --muted: #8a7f74; --line: #e7ddd0; --over: #d9433b;
  --wall: #f6e7cf; --floor: #c99a6b; --frame: #8f6a47;
  --doorFrame: #fbfbf9; --doorEdge: #cfcac2;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --text: #f2ebe2; --muted: #a59a8d; --line: #3a342e; --wall: #4a3f35; --floor: #6e5137; }
}
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.room { width: 100%; height: auto; display: block; border-radius: 16px; border: 1px solid var(--line); box-sizing: border-box; }
.wall { fill: var(--wall); }
.baseboard { fill: var(--frame); opacity: .5; }
.floor { fill: var(--floor); }
.frame { fill: var(--frame); }
.frameLine { stroke: var(--frame); stroke-width: 3; }
.doorFrame { fill: var(--doorFrame); stroke: var(--doorEdge); stroke-width: 1; }
.door { transform-box: fill-box; transform-origin: left center; transition: transform .7s ease-in-out; }
.doorPanel { fill: var(--doorFrame); stroke: var(--doorEdge); stroke-width: 1; }
.glass { fill: #bfe3ff; opacity: .55; }
.muntin { stroke: var(--doorFrame); stroke-width: 3; }
.handle { fill: #9ea3ab; }
.deck { fill: #c9c4bb; }
.deckLine { stroke: #b3ada3; stroke-width: 1; }
.mat { fill: #6b5340; }
.scratches ellipse { fill: #8a7f74; opacity: .35; }
.scratches { opacity: 0; transition: opacity 2s; }
.bed { fill: #7a5ea8; }
.bedInner { fill: #a58bd0; }
.bubble { opacity: 0; transition: opacity .3s; }
.bubble rect, .bubble path { fill: #fff; stroke: #d9cbb8; }
.bubble text { font: 700 12px -apple-system, sans-serif; fill: var(--over); }
.zzz { opacity: 0; fill: var(--muted); font: 700 12px -apple-system, sans-serif; }
.bone { opacity: 0; transition: opacity .4s; }
[data-goal] .bone { opacity: 1; }

.pupPos { transition: transform 1s ease-in-out, opacity .6s; transform: translate(26px, 108px); }
@keyframes float { from { transform: translateY(4px); opacity: .2; } to { transform: translateY(-6px); opacity: 1; } }
@keyframes pace { 0%, 100% { transform: translate(110px, 112px); } 50% { transform: translate(196px, 112px); } }

[data-pose="sleep"] .zzz { opacity: 1; }
[data-pose="sleep"] .zzz text { animation: float 1.6s ease-in-out infinite alternate; }
[data-pose="sleep"] .zzz text:nth-child(2) { animation-delay: .3s; }
[data-pose="sleep"] .zzz text:nth-child(3) { animation-delay: .6s; }
[data-pose="wait"] .pupPos { transform: translate(166px, 117px); }
[data-pose="pace"] .pupPos { animation: pace 3.2s ease-in-out infinite; }
[data-pose="pace"] .bubble, [data-pose="door"] .bubble { opacity: 1; }
[data-pose="door"] .pupPos { transform: translate(214px, 114px); }
[data-pose="door"] .scratches { opacity: 1; }
[data-pose="out"] .door { transform: scaleX(.1); }
[data-pose="out"] .pupPos { transform: translate(276px, 112px) scale(.5); opacity: 0;
  transition: transform 1.2s .5s ease-in, opacity .5s 1.3s; }

/* still pictures for widgets and the Lock Screen (tools/render_art.mjs) */
[data-still] *, [data-still] *::before { animation-play-state: paused !important; transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
}
</style>
<style id="porkCss"></style>
</head>
<body>
<div id="app" data-pose="sleep">
<svg class="room" id="room" viewBox="0 0 360 200" role="img" aria-label="Pork's room">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ff"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
  </defs>
  <rect class="wall" x="0" y="0" width="360" height="160"/>
  <rect class="baseboard" x="0" y="154" width="360" height="6"/>
  <rect class="floor" x="0" y="160" width="360" height="40"/>
  <rect x="38" y="30" width="70" height="56" rx="4" class="frame"/>
  <rect x="43" y="35" width="60" height="46" fill="url(#sky)"/>
  <line x1="73" y1="35" x2="73" y2="81" class="frameLine"/>
  <line x1="43" y1="58" x2="103" y2="58" class="frameLine"/>
  <rect x="264" y="48" width="72" height="112" class="doorFrame"/>
  <rect x="270" y="54" width="60" height="106" fill="url(#sky)"/>
  <rect x="270" y="112" width="60" height="22" fill="#6cbf5a"/>
  <rect x="270" y="134" width="60" height="26" class="deck"/>
  <path d="M270 142 h60 M270 150 h60" class="deckLine"/>
  <g id="door" class="door">
    <rect x="270" y="54" width="60" height="106" class="doorPanel"/>
    <rect x="276" y="60" width="48" height="88" class="glass"/>
    <path d="M300 60 v88 M276 89 h48 M276 118 h48" class="muntin"/>
    <rect x="318" y="100" width="3" height="14" rx="1.5" class="handle"/>
    <g class="scratches">
      <ellipse cx="284" cy="134" rx="3" ry="2.4"/><ellipse cx="291" cy="130" rx="3" ry="2.4"/>
      <ellipse cx="286" cy="124" rx="2.6" ry="2"/><ellipse cx="293" cy="138" rx="2.6" ry="2"/>
    </g>
  </g>
  <rect x="226" y="160" width="58" height="8" rx="2" class="mat"/>
  <ellipse cx="80" cy="168" rx="46" ry="11" class="bed"/>
  <ellipse cx="80" cy="164" rx="36" ry="7" class="bedInner"/>
  <text id="bone" class="bone" x="132" y="176" font-size="16">🦴</text>
  <g id="bubble" class="bubble">
    <rect x="140" y="12" width="124" height="34" rx="10"/>
    <path d="M236 45 l10 12 l2 -12z"/>
    <text id="bubbleText" x="202" y="34" text-anchor="middle">Woof! Let me out!</text>
  </g>
  <g id="zzz" class="zzz">
    <text x="120" y="120">z</text>
    <text x="130" y="108">z</text>
    <text x="142" y="94">Z</text>
  </g>
  <g id="pupPos" class="pupPos"></g>
</svg>
</div>
<script>
/*PORK_JS*/
document.getElementById('pupPos').innerHTML = PORK_SVG;
document.getElementById('porkCss').textContent = PORK_CSS;

// Called from Swift: setPork('sleep' | 'wait' | 'pace' | 'door' | 'out', goalReached)
function setPork(pose, goal) {
  var app = document.getElementById('app');
  if (app.dataset.pose !== pose) app.dataset.pose = pose;
  if (goal) app.dataset.goal = ''; else delete app.dataset.goal;
  document.getElementById('bubbleText').textContent =
    pose === 'pace' ? 'Can we go out? 🥺' : 'Woof! Let me out!';
}
</script>
</body>
</html>
